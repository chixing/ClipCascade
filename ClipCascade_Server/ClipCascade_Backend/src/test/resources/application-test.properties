# Tests use disposable memory only; no production database or network metadata.
spring.datasource.url=jdbc:h2:mem:clipcascade-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
CC_DONATIONS_ENABLED=false
logging.file.name=${java.io.tmpdir}/clipcascade-test.log
