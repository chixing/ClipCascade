name: Desktop client tests

on:
  push:
    branches: [main]
    paths:
      - ClipCascade_Desktop/**
      - .github/workflows/clients.yml
  pull_request:
    paths:
      - ClipCascade_Desktop/**
      - .github/workflows/clients.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test desktop identity and reconnect behavior
        run: python3 -m unittest discover -s ClipCascade_Desktop/tests -v
